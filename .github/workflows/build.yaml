name: brz - build and deploy
on:
  push:
    branches:
      - brz
    paths:
      - .github/workflows/build.yaml
      - deploy.sh
      - site/**
      - app/**
      - build/**
      - package.json
      - bun.lockb
      - tsconfig.json
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/brz'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4
      - name: 'Setup bun'
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Build
        run: bun run build
      - name: Deploy
        run: sh deploy.sh
