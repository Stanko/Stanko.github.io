name: brz - build and deploy
on:
  push:
    branches:
      - brz
    paths:
      - .github/workflows/build.yaml
      - deploy.sh
      - site/**
      - app/**
      - build/**
      - package.json
      - bun.lockb
      - tsconfig.json
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/brz'
    steps:
      - name: 'Checkout'
      - uses: actions/checkout@v4
      - name: 'Setup Bun'
      - uses: oven-sh/setup-bun@v2
      - name: Build and deploy
      - run: bun install
      - run: sh deploy.sh
