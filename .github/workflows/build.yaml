name: brz - build and deploy
on:
  push:
    branches:
      - brz
    paths:
      - .github/workflows/build.yaml
      - deploy.sh
      - site/**
      - app/**
      - build/**
jobs:
  # Only build PRs
  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/brz'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@master
      - name: Build and deploy
        run: sh deploy.sh
