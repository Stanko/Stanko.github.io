name: Build and Deploy
on:
  push:
    branches:
      - brz
    paths:
      - site/**
      - app/**
jobs:
  # Only build PRs
  build_and_deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/brz'
    steps:
      - name: 'Checkout'
        uses: actions/checkout@master
      - name: Build and deploy
        run: sh deploy.sh
